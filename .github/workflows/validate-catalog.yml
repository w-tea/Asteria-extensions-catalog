name: Validate catalog

on:
  pull_request:

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install validator dependencies
        run: npm ci
      - name: Validate schema and catalog policy
        env:
          ASTERIA_CATALOG_PR_AUTHOR_ASSOCIATION: ${{ github.event.pull_request.author_association }}
        run: npm run validate
